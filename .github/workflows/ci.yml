name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Type check and build
        working-directory: app
        run: npm test

      - name: Build output matches the repository
        run: |
          if [ -n "$(git status --porcelain public/app)" ]; then
            echo "public/app changed after the build - there is uncommitted build output:"
            git status --porcelain public/app
            echo ""
            echo "To fix: cd app && npm run build, then commit the public/app changes."
            exit 1
          fi
          echo "public/app is up to date."
