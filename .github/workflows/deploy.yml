name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Write the Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      - name: Deploy
        run: npx --yes firebase-tools@15 deploy --only hosting --project exc-analyzer --non-interactive

      - name: Remove the credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"

      - name: Confirm the site answers
        run: |
          set -e
          home=$(curl -s -o /dev/null -w '%{http_code}' https://exc-analyzer.web.app/)
          echo "/ -> $home"
          test "$home" = "200"
          gone=$(curl -s -o /dev/null -w '%{http_code}' https://exc-analyzer.web.app/app/)
          echo "/app/ -> $gone"
          test "$gone" = "404"
