name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  publish:
    name: Badges, report pages and sitemap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_SITE_URL: https://exc-analyzer.web.app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build the app
        working-directory: app
        run: npm run build

      - name: Verify the security policies
        working-directory: app
        run: npm run check:rls

      - name: Check the browser that renders the share cards
        run: google-chrome --version

      - name: Generate badges and pages
        working-directory: app
        run: npm run prerender

      - name: Write the Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      - name: Deploy
        run: npx --yes firebase-tools@15 deploy --only hosting --project exc-analyzer --non-interactive

      - name: Remove the credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-key.json"
